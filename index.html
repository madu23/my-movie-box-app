<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#171717">
	<meta name="description" content="My Movie Box is coming soon. The countdown is on.">
	<title>Coming Soon | My Movie Box</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #1d1a45;
			--paper: #1d1a45;
			--background: #dbeaf1;
			--muted: #565f7b;
			--red: #f33535;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background-color: var(--background);
			background-image:
				radial-gradient(ellipse at 78% 48%, rgb(243 53 53 / 9%), transparent 34%),
				repeating-linear-gradient(0deg, transparent 0 3px, rgb(29 26 69 / 2%) 3px 4px);
			font-family: Arial, sans-serif;
		}

		.page {
			position: relative;
			display: flex;
			min-height: 100vh;
			flex-direction: column;
			overflow: hidden;
			padding: 38px clamp(24px, 7vw, 100px) 28px;
		}

		.page::before,
		.page::after {
			position: absolute;
			top: 0;
			bottom: 0;
			width: 10px;
			content: "";
			opacity: .44;
			background: radial-gradient(circle, var(--muted) 2px, transparent 2.5px) center top / 10px 22px repeat-y;
			pointer-events: none;
		}

		.page::before {
			left: 12px;
		}

		.page::after {
			right: 12px;
		}

		header,
		footer {
			position: relative;
			z-index: 1;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		header {
			padding: 12px 16px;
			border-radius: 4px;
			background: var(--ink);
		}

		.brand {
			display: block;
			width: min(260px, 58vw);
			height: auto;
		}

		.top-note,
		.footer-note {
			color: var(--muted);
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 2px;
			text-transform: uppercase;
		}

		.top-note {
			color: var(--background);
		}

		main {
			display: grid;
			flex: 1;
			align-content: center;
			justify-items: center;
			padding: 72px 0 80px;
			text-align: center;
		}

		.eyebrow {
			margin: 0 0 22px;
			color: var(--red);
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 4px;
			text-transform: uppercase;
		}

		h1 {
			max-width: 760px;
			margin: 0;
			font-family: Arial, sans-serif;
			font-size: clamp(44px, 7.2vw, 88px);
			font-weight: 400;
			line-height: 1.02;
		}

		h1 span {
			color: var(--red);
			font-style: italic;
		}

		.intro {
			max-width: 450px;
			margin: 22px 0 0;
			color: var(--muted);
			font-size: 16px;
			line-height: 1.65;
		}

		.countdown {
			display: flex;
			align-items: flex-start;
			gap: clamp(18px, 5vw, 58px);
			margin-top: 52px;
			font-variant-numeric: tabular-nums;
		}

		.time-unit {
			min-width: 68px;
		}

		.time-value {
			display: block;
			color: var(--paper);
			font-family: Arial, sans-serif;
			font-size: clamp(42px, 7vw, 68px);
			line-height: 1;
		}

		.time-label {
			display: block;
			margin-top: 12px;
			color: var(--muted);
			font-size: 10px;
			font-weight: 700;
			letter-spacing: 2px;
		}

		.time-separator {
			padding-top: 4px;
			color: var(--red);
			font-family: Arial, sans-serif;
			font-size: clamp(36px, 6vw, 56px);
			line-height: 1;
		}

		footer {
			min-height: 30px;
		}

		.footer-note:last-child {
			color: var(--red);
		}

		@media (max-width: 560px) {
			.page {
				padding: 26px 28px 22px;
			}

			.page::before {
				left: 8px;
			}

			.page::after {
				right: 8px;
			}

			.top-note {
				max-width: 90px;
				color: var(--background);
				font-size: 9px;
				letter-spacing: 1px;
				text-align: right;
			}

			main {
				padding: 62px 0;
			}

			.eyebrow {
				font-size: 10px;
				letter-spacing: 3px;
			}

			.intro {
				font-size: 14px;
			}

			.countdown {
				gap: clamp(10px, 4vw, 20px);
				margin-top: 42px;
			}

			.time-unit {
				min-width: 56px;
			}

			.time-label {
				font-size: 8px;
				letter-spacing: 1px;
			}

			footer {
				gap: 12px;
			}

			.footer-note {
				font-size: 8px;
				letter-spacing: 1px;
			}
		}
	</style>
</head>
<body>
	<div class="page">
		<header>
			<img class="brand" src="logo.svg" alt="MMB TV, My Movie Box">
			<span class="top-note">A new feature is on its way</span>
		</header>

		<main>
			<p class="eyebrow">The opening credits start in</p>
			<h1>Your next movie night<br>is coming <span>soon.</span></h1>
			<p class="intro">The countdown is on. Get comfortable, pick your favourite seat, and we’ll see you at the movies.</p>

			<div class="countdown" role="timer" aria-label="Time until launch">
				<div class="time-unit"><span class="time-value" id="hours">24</span><span class="time-label">HOURS</span></div>
				<span class="time-separator" aria-hidden="true">:</span>
				<div class="time-unit"><span class="time-value" id="minutes">00</span><span class="time-label">MINUTES</span></div>
				<span class="time-separator" aria-hidden="true">:</span>
				<div class="time-unit"><span class="time-value" id="seconds">00</span><span class="time-label">SECONDS</span></div>
			</div>
		</main>

		<footer>
			<span class="footer-note">My Movie Box</span>
			<span class="footer-note">Coming soon</span>
		</footer>
	</div>

	<script>
		const countdownDuration = 24 * 60 * 60 * 1000;
		const deadlineKey = "myMovieBoxLaunchDeadline";
		let deadline = Number(localStorage.getItem(deadlineKey));

		if (!deadline || deadline <= Date.now()) {
			deadline = Date.now() + countdownDuration;
			localStorage.setItem(deadlineKey, String(deadline));
		}

		const hoursElement = document.getElementById("hours");
		const minutesElement = document.getElementById("minutes");
		const secondsElement = document.getElementById("seconds");

		function updateCountdown() {
			const remaining = Math.max(0, deadline - Date.now());
			const totalSeconds = Math.ceil(remaining / 1000);
			const hours = Math.floor(totalSeconds / 3600);
			const minutes = Math.floor((totalSeconds % 3600) / 60);
			const seconds = totalSeconds % 60;

			hoursElement.textContent = String(hours).padStart(2, "0");
			minutesElement.textContent = String(minutes).padStart(2, "0");
			secondsElement.textContent = String(seconds).padStart(2, "0");

			if (remaining === 0) {
				deadline = Date.now() + countdownDuration;
				localStorage.setItem(deadlineKey, String(deadline));
			}
		}

		updateCountdown();
		window.setInterval(updateCountdown, 1000);
	</script>
</body>
</html>
